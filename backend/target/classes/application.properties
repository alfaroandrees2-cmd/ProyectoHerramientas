spring.application.name=backend

# Configuracion de conexion MySQL usando placeholders para entornos.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:skipline}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:skipline_user}
spring.datasource.password=${DB_PASSWORD:skipline_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${SERVER_PORT:8080}

# Herramientas de desarrollo.
spring.devtools.restart.enabled=true
